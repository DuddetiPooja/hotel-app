<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking & Restaurant Management - Phase 1</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #0f172a;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding: 30px 20px; }
        .wrapper { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; }
        header h1 { font-size: 26px; font-weight: 800; color: var(--secondary); margin-bottom: 6px; }
        header p { color: var(--text-muted); font-size: 14px; }
        
        .nav-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .tab-btn { background: #e2e8f0; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 14px; }
        .tab-btn.active { background: var(--primary); color: white; }
        
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media(max-width: 860px) { .grid-layout { grid-template-columns: 1fr; } }
        
        .card { background: var(--card-bg); border-radius: 12px; padding: 22px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
        .card-header h2 { font-size: 18px; font-weight: 700; color: var(--secondary); }
        .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 9999px; }
        .badge-available { background-color: #dcfce7; color: var(--success); }
        .badge-occupied { background-color: #fee2e2; color: var(--danger); }
        .badge-type { background-color: #e0e7ff; color: #4338ca; }

        .items-list { list-style: none; display: flex; flex-direction: column; gap: 10px; max-height: 480px; overflow-y: auto; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; }
        .item-info h4 { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
        .item-info p { font-size: 12px; color: var(--text-muted); }
        .item-actions { display: flex; gap: 6px; align-items: center; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; }
        input, select { width: 100%; padding: 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none; }
        input:focus, select:focus { border-color: var(--primary); }
        
        .btn { border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 13px; }
        .btn-primary { background: var(--primary); color: white; width: 100%; margin-top: 8px; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-danger { background: #fee2e2; color: var(--danger); padding: 5px 8px; border-radius: 5px; font-size: 11px; }
        .btn-toggle { background: #f1f5f9; color: var(--secondary); padding: 5px 8px; border-radius: 5px; font-size: 11px; }
        
        .alert { padding: 9px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; display: none; }
        .alert-success { background: #dcfce7; color: var(--success); }
        .alert-error { background: #fee2e2; color: var(--danger); }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1>Hotel Booking &amp; Restaurant Management System</h1>
        <p>Spring Boot Layered Full Stack &bull; Phase 1</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchSection('rooms', event)">🏨 Hotel Rooms (NEW)</button>
        <button class="tab-btn" onclick="switchSection('tables', event)">🍽️ Restaurant Tables</button>
        <button class="tab-btn" onclick="switchSection('food', event)">🍔 Food Menu</button>
    </div>

    <!-- ROOMS SECTION -->
    <div id="section-rooms" class="grid-layout">
        <div class="card">
            <div class="card-header">
                <h2>All Hotel Rooms</h2>
                <span id="room-count" class="badge badge-type">0 Rooms</span>
            </div>
            <ul id="room-list" class="items-list">
                <li style="text-align: center; color: var(--text-muted); padding: 20px;">Loading rooms...</li>
            </ul>
        </div>
        <div class="card">
            <div class="card-header">
                <h2>Add New Hotel Room</h2>
            </div>
            <div id="room-alert" class="alert"></div>
            <form id="room-form">
                <div class="form-group">
                    <label>Room Number (e.g. 101, 204):</label>
                    <input type="text" id="roomNumber" placeholder="101" required>
                </div>
                <div class="form-group">
                    <label>Room Type:</label>
                    <select id="roomType" required>
                        <option value="SINGLE">Single Room (1 Person)</option>
                        <option value="DOUBLE" selected>Double Room (2 Persons)</option>
                        <option value="DELUXE">Deluxe Room (2-3 Persons)</option>
                        <option value="SUITE">Executive Suite (4 Persons)</option>
                        <option value="PRESIDENTIAL">Presidential Suite (Luxury)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price Per Night ($):</label>
                    <input type="number" step="0.01" id="pricePerNight" placeholder="99.00" required min="1">
                </div>
                <div class="form-group">
                    <label>Capacity (Guests):</label>
                    <input type="number" id="roomCapacity" placeholder="2" required min="1">
                </div>
                <div class="form-group">
                    <label>Availability:</label>
                    <select id="roomIsAvailable">
                        <option value="true">Available for Booking</option>
                        <option value="false">Occupied</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description / Amenities:</label>
                    <input type="text" id="roomDescription" placeholder="King bed, City view, Free Wi-Fi">
                </div>
                <button type="submit" class="btn btn-primary">+ Save Hotel Room</button>
            </form>
        </div>
    </div>

    <!-- TABLES SECTION (Original preserved) -->
    <div id="section-tables" class="grid-layout" style="display: none;">
        <div class="card">
            <div class="card-header">
                <h2>Restaurant Tables</h2>
                <span id="table-count" class="badge badge-type">0 Tables</span>
            </div>
            <ul id="table-list" class="items-list">Loading tables...</ul>
        </div>
        <div class="card">
            <div class="card-header">
                <h2>Add Restaurant Table</h2>
            </div>
            <form id="table-form">
                <div class="form-group">
                    <label>Table Number:</label>
                    <input type="number" id="tableNumber" required min="1">
                </div>
                <div class="form-group">
                    <label>Capacity (Persons):</label>
                    <input type="number" id="capacity" required min="1">
                </div>
                <div class="form-group">
                    <label>Status:</label>
                    <select id="isReserved">
                        <option value="false">Available</option>
                        <option value="true">Reserved</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">+ Save Table</button>
            </form>
        </div>
    </div>

    <!-- FOOD MENU SECTION (Original preserved) -->
    <div id="section-food" class="grid-layout" style="display: none;">
        <div class="card">
            <div class="card-header">
                <h2>Restaurant Menu Items</h2>
                <span id="food-count" class="badge badge-type">0 Items</span>
            </div>
            <ul id="food-list" class="items-list">Loading food menu...</ul>
        </div>
        <div class="card">
            <div class="card-header">
                <h2>Add Menu Item</h2>
            </div>
            <form id="food-form">
                <div class="form-group">
                    <label>Food Item Name:</label>
                    <input type="text" id="foodName" required placeholder="e.g. Margherita Pizza">
                </div>
                <div class="form-group">
                    <label>Price ($):</label>
                    <input type="number" step="0.01" id="foodPrice" required placeholder="14.50" min="0.5">
                </div>
                <div class="form-group">
                    <label>Category:</label>
                    <input type="text" id="foodCategory" required placeholder="Main Course, Beverages, Desserts">
                </div>
                <button type="submit" class="btn btn-primary">+ Save Food Item</button>
            </form>
        </div>
    </div>
</div>

<script>
    function switchSection(name, evt) {
        document.querySelectorAll('.grid-layout').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById('section-' + name).style.display = 'grid';
        if (evt) evt.target.classList.add('active');
    }

    // ROOMS LOGIC
    function loadRooms() {
        fetch('/api/rooms')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('room-list');
                document.getElementById('room-count').innerText = data.length + ' Rooms';
                list.innerHTML = '';
                if (!data || data.length === 0) {
                    list.innerHTML = '<li style="text-align: center; color: var(--text-muted); padding: 20px;">No hotel rooms added yet. Create your first room using the form!</li>';
                    return;
                }
                data.forEach(r => {
                    const badgeClass = r.available ? 'badge-available' : 'badge-occupied';
                    const statusText = r.available ? 'Available' : 'Occupied';
                    list.innerHTML += `
                        <li class="item-row">
                            <div class="item-info">
                                <h4>Room #${r.roomNumber} &bull; <span class="badge badge-type">${r.roomType}</span></h4>
                                <p>Capacity: ${r.capacity} Guests &bull; <strong>$${r.pricePerNight.toFixed(2)}/night</strong> &bull; ${r.description || 'Standard amenities'}</p>
                            </div>
                            <div class="item-actions">
                                <span class="badge ${badgeClass}">${statusText}</span>
                                <button class="btn btn-toggle" onclick="toggleRoomStatus(${r.id}, ${!r.available})">Toggle</button>
                                <button class="btn btn-danger" onclick="deleteRoom(${r.id})">Delete</button>
                            </div>
                        </li>
                    `;
                });
            })
            .catch(() => {
                document.getElementById('room-list').innerHTML = '<li style="color: var(--danger); padding: 10px;">Failed to connect to /api/rooms. Ensure Spring Boot is running on port 8080.</li>';
            });
    }

    function toggleRoomStatus(id, newStatus) {
        fetch('/api/rooms/' + id + '/availability?status=' + newStatus, { method: 'PATCH' })
            .then(() => loadRooms());
    }

    function deleteRoom(id) {
        if (confirm('Are you sure you want to delete this room?')) {
            fetch('/api/rooms/' + id, { method: 'DELETE' })
                .then(() => loadRooms());
        }
    }

    document.getElementById('room-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const payload = {
            roomNumber: document.getElementById('roomNumber').value.trim(),
            roomType: document.getElementById('roomType').value,
            pricePerNight: parseFloat(document.getElementById('pricePerNight').value),
            capacity: parseInt(document.getElementById('roomCapacity').value),
            available: document.getElementById('roomIsAvailable').value === 'true',
            description: document.getElementById('roomDescription').value.trim()
        };

        const alertEl = document.getElementById('room-alert');

        fetch('/api/rooms', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(async res => {
            if (!res.ok) {
                const err = await res.json().catch(() => ({ message: 'Failed to create room' }));
                throw new Error(err.message || Object.values(err)[0] || 'Validation error');
            }
            return res.json();
        })
        .then(() => {
            document.getElementById('room-form').reset();
            alertEl.style.display = 'block';
            alertEl.className = 'alert alert-success';
            alertEl.innerText = 'Room added successfully!';
            setTimeout(() => alertEl.style.display = 'none', 3000);
            loadRooms();
        })
        .catch(err => {
            alertEl.style.display = 'block';
            alertEl.className = 'alert alert-error';
            alertEl.innerText = 'Error: ' + err.message;
        });
    });

    // TABLES LOGIC (Preserved)
    function loadTables() {
        fetch('/api/tables')
            .then(res => res.json())
            .then(data => {
                const tableList = document.getElementById('table-list');
                document.getElementById('table-count').innerText = data.length + ' Tables';
                tableList.innerHTML = '';
                if (!data || data.length === 0) { tableList.innerHTML = '<li style="text-align: center; color: var(--text-muted); padding: 20px;">No tables found.</li>'; return; }
                data.forEach(t => {
                    const statusClass = t.reserved ? 'badge-occupied' : 'badge-available';
                    const statusText = t.reserved ? 'Reserved' : 'Available';
                    tableList.innerHTML += `
                        <li class="item-row">
                            <div class="item-info">
                                <h4>Table #${t.tableNumber}</h4>
                                <p>Capacity: ${t.capacity} guests</p>
                            </div>
                            <div class="item-actions">
                                <span class="badge ${statusClass}">${statusText}</span>
                                <button class="btn btn-danger" onclick="deleteTable(${t.id})">Delete</button>
                            </div>
                        </li>
                    `;
                });
            })
            .catch(() => {
                document.getElementById('table-list').innerHTML = '<li style="color: var(--danger); padding: 10px;">Failed to load tables.</li>';
            });
    }

    function deleteTable(id) {
        if (confirm('Delete this table?')) {
            fetch('/api/tables/' + id, { method: 'DELETE' }).then(() => loadTables());
        }
    }

    document.getElementById('table-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const newTable = {
            tableNumber: parseInt(document.getElementById('tableNumber').value),
            capacity: parseInt(document.getElementById('capacity').value),
            reserved: document.getElementById('isReserved').value === 'true'
        };

        fetch('/api/tables', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newTable)
        }).then(() => {
            document.getElementById('table-form').reset();
            loadTables();
        });
    });

    // FOOD LOGIC (Preserved)
    function loadFood() {
        fetch('/api/food')
            .then(res => res.json())
            .then(data => {
                const foodList = document.getElementById('food-list');
                document.getElementById('food-count').innerText = data.length + ' Items';
                foodList.innerHTML = '';
                if (!data || data.length === 0) { foodList.innerHTML = '<li style="text-align: center; color: var(--text-muted); padding: 20px;">No food items found.</li>'; return; }
                data.forEach(f => {
                    foodList.innerHTML += `
                        <li class="item-row">
                            <div class="item-info">
                                <h4>${f.name}</h4>
                                <p><span class="badge badge-type">${f.category}</span> &bull; <strong>$${f.price.toFixed(2)}</strong></p>
                            </div>
                            <div class="item-actions">
                                <button class="btn btn-danger" onclick="deleteFood(${f.id})">Delete</button>
                            </div>
                        </li>
                    `;
                });
            })
            .catch(() => {
                document.getElementById('food-list').innerHTML = '<li style="color: var(--danger); padding: 10px;">Failed to load food menu.</li>';
            });
    }

    function deleteFood(id) {
        if (confirm('Delete this food item?')) {
            fetch('/api/food/' + id, { method: 'DELETE' }).then(() => loadFood());
        }
    }

    document.getElementById('food-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const newFood = {
            name: document.getElementById('foodName').value,
            price: parseFloat(document.getElementById('foodPrice').value),
            category: document.getElementById('foodCategory').value
        };

        fetch('/api/food', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newFood)
        }).then(() => {
            document.getElementById('food-form').reset();
            loadFood();
        });
    });

    // Initial load
    loadRooms();
    loadTables();
    loadFood();
</script>
</body>
</html>
